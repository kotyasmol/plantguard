name: plantguard

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
    tmpfs:
      - /etc/kafka/secrets:uid=1000,gid=1000,mode=0770
      - /var/lib/kafka/data:uid=1000,gid=1000,mode=0770

  ksqldb:
    image: confluentinc/cp-ksqldb-server:7.8.0
    hostname: ksqldb
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_HOST_NAME: ksqldb
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KSQL_KSQL_SERVICE_ID: plantguard_
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8088/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  ksqldb-init:
    image: confluentinc/cp-ksqldb-cli:7.8.0
    depends_on:
      ksqldb:
        condition: service_healthy
    profiles: ["tools"]
    volumes:
      - ./data-integration/ksqldb:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["ksql http://ksqldb:8088 --file /scripts/01-init.sql"]

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantguard}
      POSTGRES_USER: ${POSTGRES_USER:-plantguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: plantguard-app:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
      - "5173:8000"
    environment:
      PLANTGUARD_ENV: development
      PLANTGUARD_CORS_ORIGINS: http://localhost:5173
      PLANTGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plantguard}:${POSTGRES_PASSWORD:-plantguard}@postgres:5432/${POSTGRES_DB:-plantguard}
      PLANTGUARD_MAX_IMAGE_BYTES: 10485760
      PLANTGUARD_MAX_IMAGE_PIXELS: 25000000
      PLANTGUARD_PHOTO_STORAGE_PATH: /var/lib/plantguard/photos
      PLANTGUARD_PHOTO_URL_TTL_SECONDS: 900
      PLANTGUARD_PHOTO_SIGNING_KEY: ${PLANTGUARD_PHOTO_SIGNING_KEY:-development-only-photo-signing-key}
    volumes:
      - photo-data:/var/lib/plantguard/photos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres-migrations:
    image: postgres:16-alpine
    profiles: ["tests"]
    environment:
      POSTGRES_DB: plantguard_migrations
      POSTGRES_USER: plantguard
      POSTGRES_PASSWORD: plantguard
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantguard -d plantguard_migrations"]
      interval: 2s
      timeout: 5s
      retries: 15

  migration-test:
    image: plantguard-app:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: ["tests"]
    environment:
      PLANTGUARD_ENV: test
      PLANTGUARD_DATABASE_URL: postgresql+psycopg://plantguard:plantguard@postgres-migrations:5432/plantguard_migrations
    depends_on:
      postgres-migrations:
        condition: service_healthy
    command: ["python", "/workspace/services/api/migration_test.py"]

volumes:
  postgres-data:
  photo-data:
