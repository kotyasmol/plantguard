name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plantguard_migrations
          POSTGRES_USER: plantguard
          POSTGRES_PASSWORD: plantguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantguard -d plantguard_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANTGUARD_ENV: test
      PLANTGUARD_DATABASE_URL: postgresql+psycopg://plantguard:plantguard@localhost:5432/plantguard_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check services tests scripts
      - run: python -m pytest
      - run: python services/api/migration_test.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @plantguard/web
      - run: npm run test --workspace @plantguard/web
      - run: npm run build --workspace @plantguard/web
