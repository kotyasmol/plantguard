name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plantguard_migrations
          POSTGRES_USER: plantguard
          POSTGRES_PASSWORD: plantguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantguard -d plantguard_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANTGUARD_ENVIRONMENT: test
      PLANTGUARD_DATABASE_URL: postgresql+psycopg://plantguard:plantguard@localhost:5432/plantguard_migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check services tests scripts
      - run: python -m pytest --cov=plantguard_api --cov=plantguard_mining --cov-report=term-missing --cov-fail-under=85
      - run: python scripts/dataset_registry.py --manifest datasets/plantguard-v1/manifest.jsonl --report datasets/plantguard-v1/audit-report.json
      - run: python scripts/evaluate_visual_baseline.py
      - run: python scripts/evaluate_text_baseline.py
      - run: python scripts/evaluate_comparison_baseline.py
      - run: python services/api/migration_test.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @plantguard/web
      - run: npm run test:coverage --workspace @plantguard/web
      - run: npm run build --workspace @plantguard/web

  streams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-streams

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -p plantguard-browser up --build --detach --wait api
      - run: docker compose -p plantguard-browser exec -T api alembic -c /workspace/services/api/alembic.ini upgrade head
      - run: npx playwright test --config=e2e/playwright.config.ts
      - if: failure()
        run: docker compose -p plantguard-browser logs --tail 80 api
      - if: always()
        run: docker compose -p plantguard-browser down --volumes
